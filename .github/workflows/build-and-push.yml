name: build-and-push

# Publishes the site image to GHCR; Coolify on kwiz-prod pulls it and serves https://kwiz.live.
# Same pipeline as Quizup's build-and-push.yml (see Quizup/docs/deployment.md).
#
#   ghcr.io/asimhsidd/quizup-website  :main (Coolify tracks this) and :sha-<shortsha>

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch: {}

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # App Links fail silently on a wrong assetlinks.json; refuse to ship one
      - run: node scripts/check-assetlinks.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/asimhsidd/quizup-website
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Trigger Coolify redeploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        if: ${{ env.COOLIFY_WEBHOOK != '' }}
        continue-on-error: true
        run: .github/scripts/coolify-deploy.sh
