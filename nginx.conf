# Behind Coolify's proxy, which terminates TLS. Redirects stay relative (absolute_redirect off)
# so /privacy → /privacy/ doesn't bounce to http:// or to the container's port.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    error_page 404 /404.html;

    # add_header in a location replaces these, so locations below only use `expires`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.nestory.homes; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.kwiz.live https://analytics.nestory.homes; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
    }

    # Pages pick up a redeploy at once
    location ~* \.(html|css|xml|txt)$ {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/xml application/javascript text/javascript image/svg+xml;
}
